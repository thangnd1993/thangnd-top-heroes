[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "top-heroes-auto-manager"
version = "0.1.0"
description = "Windows LDPlayer manager with explicit safe selection"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "numpy>=2,<3", "opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
top-heroes-auto = "top_heroes_auto.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "DTZ"]
