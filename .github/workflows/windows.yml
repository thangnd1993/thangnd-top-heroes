name: Windows Validation
on:
  push:
    branches:
      - main
      - codex/phase1-diagnostic-cli
      - codex/phase2-run-queue
      - codex/phase3-screen-recognition
      - codex/phase4-home-recovery
      - codex/phase5-idle-reward
      - codex/phase6-vip-pack-recruit
      - codex/phase7-guild-mail
      - codex/phase8-dynamic-events
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Record packaged build provenance
        run: python tools/write_build_info.py --commit "${{ github.sha }}" --ci-run "${{ github.run_id }}" --repository "${{ github.repository }}"
      - run: python -m PyInstaller --clean --noconfirm TopHeroesAutoManager.spec
      - name: Check executable starts
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\TopHeroesAutoManager\TopHeroesAutoManager.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id
            throw "Application did not complete GUI smoke test within 60 seconds"
          }
          if ($process.ExitCode -ne 0) { throw "Application smoke test failed: $($process.ExitCode)" }
      - name: Verify packaged version metadata
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'version.json'
          $p = Start-Process -FilePath .\dist\TopHeroesAutoManager\TopHeroesAutoManager.exe -ArgumentList '--version-file',$out -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id; throw 'version query timed out' }
          $v = Get-Content $out -Raw | ConvertFrom-Json
          if ($v.commit -ne $env:GITHUB_SHA) { throw "Packaged commit $($v.commit) != $env:GITHUB_SHA" }
          if ($v.release_date -notmatch '^\d{4}-\d{2}-\d{2}$') { throw "Bad release date $($v.release_date)" }
          if ($v.channel -ne 'CI Release') { throw "Unexpected channel $($v.channel)" }
          Write-Host "Packaged: $($v.version) $($v.commit) $($v.release_date) $($v.channel)"
      - uses: actions/upload-artifact@v4
        with:
          name: TopHeroesAutoManager-Windows-x64
          path: dist/TopHeroesAutoManager/
          if-no-files-found: error
