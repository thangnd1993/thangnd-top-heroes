name: Windows Phase 1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --clean --noconfirm TopHeroesAutoManager.spec
      - name: Check executable starts
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\TopHeroesAutoManager\TopHeroesAutoManager.exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "Application exited during startup: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: TopHeroesAutoManager-Windows-x64
          path: dist/TopHeroesAutoManager/
          if-no-files-found: error
